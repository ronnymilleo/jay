[package]
name = "jay"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Local project manager with a CLI, plain-text tasks, and MCP integration"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "7", features = ["custom_styling"] }
rmcp = { version = "3.1.4", features = ["transport-io", "schemars"] }
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
toml = { version = "0.8", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
