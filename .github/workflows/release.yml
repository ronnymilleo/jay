name: Release

# A version tag, such as v0.4.0, checks that the tag matches the crate version, runs the test
# suite, publishes the package to crates.io and opens the GitHub release of that tag; a tag with
# a suffix, such as v0.4.0-rc1, publishes a pre-release version and never becomes the latest
# release
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release of the tag
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A published version is immutable: a v0.4.0 tag must publish exactly 0.4.0, or crates.io
      # keeps a version the tag does not describe and the number can never be reused
      - name: Check that the tag matches the crate version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # A tag with a suffix, such as v0.4.0-rc1, is a test build and never becomes the latest
          # release
          prerelease: ${{ contains(github.ref_name, '-') }}
